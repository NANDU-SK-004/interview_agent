services:
  - type: web
    name: skillhire
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false # To be customized with your final Render URL
      - key: GEMINI_API_KEY
        sync: false # Set manually in Render dashboard
